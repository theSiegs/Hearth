add_bonus:
  fields:
    person:
      required: true
      selector:
        entity:
          domain: person
    minutes:
      required: true
      example: 15
      selector:
        number:
          min: -1440
          max: 1440
          step: 5
          unit_of_measurement: min
          mode: box
    group:
      default: all
      example: youtube
      selector:
        text:
    device:
      example: fs:xbox
      selector:
        text:

