set_schedule:
  fields:
    people:
      required: true
      selector:
        entity:
          domain: person
          multiple: true
    days:
      example: '["school_days"]'
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
            - day_off
            - school_days
            - weekend
            - every_day
    changes:
      example: '[{"at": "07:45", "mode": "school"}, {"at": "15:15", "mode": "free"}, {"at": "21:30", "mode": "sleep"}]'
      selector:
        object:
    limits:
      example: '{"all": 180, "games": 60}'
      selector:
        object:
    half_day_ends:
      example: "12:00"
      selector:
        time:
    half_day_limits:
      selector:
        select:
          options:
            - day_off
            - weekday
