add_bonus:
  fields:
    person:
      required: true
      selector:
        entity:
          domain: person
    minutes:
      required: true
      example: 15
      selector:
        number:
          min: -1440
          max: 1440
          step: 5
          unit_of_measurement: min
          mode: box
    group:
      default: all
      example: youtube
      selector:
        text:

set_budget:
  fields:
    person:
      required: true
      selector:
        entity:
          domain: person
    group:
      required: true
      example: games
      selector:
        text:
    minutes:
      required: true
      example: 90
      selector:
        number:
          min: 0
          max: 1440
          step: 5
          unit_of_measurement: min
          mode: box
    days:
      default: both
      selector:
        select:
          options:
            - both
            - school_days
            - other_days

get_watch_log:
  fields:
    person:
      required: true
      selector:
        entity:
          domain: person
    days:
      example: 7
      selector:
        number:
          min: 1
          max: 366
          mode: box
    limit:
      default: 200
      selector:
        number:
          min: 1
          max: 2000
          mode: box

watch_digest:
  fields:
    person:
      selector:
        entity:
          domain: person
    days:
      default: 7
      selector:
        number:
          min: 1
          max: 31
          mode: box

