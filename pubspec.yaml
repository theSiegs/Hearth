name: flauncher
description: "Hearth: a private home screen for Google TV."

version: 2026.10.86+8320

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: 3.47.8

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.0.7
  intl: any
  collection: any
  clock: any
  crypto: ^3.0.3
  drift: ^2.35.3
  path: ^1.9.0
  path_provider: ^2.0.13
  package_info_plus: ^10.2.2
  provider: ^6.0.5
  shared_preferences: ^2.3.3
  # SQLite itself: bundled by the sqlite3 package's build hook (it replaced sqlite3_flutter_libs)
  sqlite3: ^3.8.0
  flutter_localizations:
    sdk: flutter
  pool: ^1.5.2
  share_plus: ^13.3.1
  qr_flutter: ^4.1.0
  flutter_svg: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.10.0
  flutter_lints: ^6.0.0
  mockito: ^5.5.0
  drift_dev: ^2.35.2
  transparent_image: ^2.0.1
  fake_async: any

  shared_preferences_platform_interface: any
  path_provider_platform_interface: any
  plugin_platform_interface: any
  package_info_plus_platform_interface: any

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/logo.png
    # TMDB's approved logo (themoviedb.org/about/logos-attribution), shown in About as its terms require
    - assets/tmdb_logo.svg
