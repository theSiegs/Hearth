name: flauncher
description: "Hearth: a private home screen for Google TV."

version: 2026.10.35+8246

environment:
  sdk: ">=3.4.3"
  flutter: 3.24.5

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.0.7
  intl: any
  collection: any
  crypto: ^3.0.3
  drift: ^2.14.1
  path: ^1.9.0
  path_provider: ^2.0.13
  package_info_plus: ^7.0.0
  provider: ^6.0.5
  shared_preferences: ^2.3.3
  sqlite3_flutter_libs: ^0.5.13
  flutter_localizations:
    sdk: flutter
  pool: ^1.5.2
  share_plus: ^10.0.0
  qr_flutter: ^4.1.0
  flutter_svg: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.3.3
  flutter_lints: ^5.0.0
  mockito: ^5.3.2
  drift_dev: ^2.5.2
  transparent_image: ^2.0.1
  sqlite3: any
  fake_async: any

  shared_preferences_platform_interface: any
  path_provider_platform_interface: any
  plugin_platform_interface: any
  package_info_plus_platform_interface: any

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/logo.png
    # TMDB's approved logo (themoviedb.org/about/logos-attribution), shown in About as its terms require
    - assets/tmdb_logo.svg
