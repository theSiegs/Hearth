plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

// Force Flutter to only build for ARMv7 and ARMv8a by default
if (!project.hasProperty('target-platform')) {
    project.ext.set('target-platform', 'android-arm,android-arm64')
} else {
    def platforms = project.property('target-platform').split(',')
    def filtered = platforms.findAll { it == 'android-arm' || it == 'android-arm64' }.join(',')
    if (filtered) {
        project.ext.set('target-platform', filtered)
    }
}


def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def secretProperties = new Properties()
secretProperties.setProperty("signing_keystore_password", "${System.getenv('FLAUNCHER_KEYSTORE_PASSWORD')}")
secretProperties.setProperty("signing_key_password", "${System.getenv('FLAUNCHER_SIGNING_KEY_PASSWORD')}")
secretProperties.setProperty("signing_key_alias", "${System.getenv('FLAUNCHER_SIGNING_KEY_ALIAS')}")

// Hearth's app id. Up to v2026.10.x it was the fork's "com.leanbitlab.ltvL"; it's "com.thesiegs.hearth" now (see
// docs/design/app-id-change.md). A "bridge" build (-PhearthBridge=true, or HEARTH_BRIDGE=true in the environment)
// is this same code under the OLD id: it updates the old app in place, hands its data to the new app through
// LegacyExportProvider, and its updater installs the new app.
def hearthAppId = "com.thesiegs.hearth"
def legacyAppId = "com.leanbitlab.ltvL"
def bridgeBuild = (project.findProperty('hearthBridge') ?: System.getenv('HEARTH_BRIDGE') ?: 'false').toString() == 'true'

def keystoreFilePath = System.getenv("KEYSTORE_FILE") ?: localProperties['storeFile']
def hasKeystore = keystoreFilePath != null && file(keystoreFilePath).exists()

android {
    // JVM unit tests (PIN entry logic) touch Android classes only in passing; stubs return defaults there
    testOptions {
        unitTests.returnDefaultValues = true
    }
    dependenciesInfo {
        // Disables dependency metadata when building APKs (for IzzyOnDroid/F-Droid)
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles (for Google Play)
        includeInBundle = false
    }

    defaultConfig {
        applicationId bridgeBuild ? legacyAppId : hearthAppId
        compileSdk 35
        minSdkVersion flutter.minSdkVersion
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        // The app ids on both sides of the move (without the debug suffix), and whether this is the bridge build
        buildConfigField "String", "HEARTH_APP_ID", "\"${hearthAppId}\""
        buildConfigField "String", "LEGACY_APP_ID", "\"${legacyAppId}\""
        buildConfigField "boolean", "BRIDGE", "${bridgeBuild}"
        // Only the bridge build (the old id) offers its data to the new app
        manifestPlaceholders = [legacyExportEnabled: bridgeBuild.toString()]
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        debug {}
        release {
            if (hasKeystore) {
                storeFile file(keystoreFilePath)
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: localProperties['storePassword']
                keyAlias System.getenv("KEY_ALIAS") ?: localProperties['keyAlias']
                keyPassword System.getenv("KEY_PASSWORD") ?: localProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            signingConfig signingConfigs.debug
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }

    splits {
        abi {
            // https://stackoverflow.com/a/39950584/21037183
            enable gradle.startParameter.taskNames.any { it.contains("assembleRelease") } && System.getenv("UNIVERSAL_ONLY") != "true"
            reset()
            include "armeabi-v7a", "arm64-v8a"
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    // The Java package; the same in the bridge build, so component names there are com.leanbitlab.ltvL/com.thesiegs.hearth.X
    namespace 'com.thesiegs.hearth'

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.versionCodeOverride = variant.versionCode
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            if (abi != null) {
                outputFileName = "Hearth-${abi}-${variant.buildType.name}.apk"
            } else {
                outputFileName = "Hearth-universal-${variant.buildType.name}.apk"
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Hearth's self-adb transport (see SelfAdb.java): an embedded adb client so Hearth can run its OWN
    // kids-profile install/uninstall as the shell user over 127.0.0.1:5555, after the parent's one-time on-screen
    // "Allow debugging?" approval. Pin/confirm the latest version when first building.
    implementation "dev.mobile:dadb:1.2.10"
    // Plain-Java unit tests (src/test): the PIN entry state machine
    testImplementation "junit:junit:4.13.2"
}
