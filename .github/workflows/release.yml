name: Release

# A release of the Home Assistant integration, which HACS installs from its tag. Hearth TV's APKs are released from
# theSiegs/HearthTV, not here.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v2026.12.01)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
      # Only tags containing '-' (v2026.11.24-rc1) are pre-releases. A version tag is a full release, so the Home
      # Assistant Marketplace offers it by its version (it hides pre-releases unless "Show beta versions" is on)
      PRERELEASE: ${{ contains(github.event.inputs.tag_name || github.ref_name, '-') }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      # HACS installs the integration from this tag: refuse a release whose manifest version isn't the tag's.
      - name: Check integration version
        run: python3 .github/scripts/integration_version.py --tag "$TAG_NAME"

      - name: Release notes
        run: python3 .github/scripts/integration_version.py --notes "$TAG_NAME" > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ env.PRERELEASE == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
