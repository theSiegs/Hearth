name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# The Home Assistant integration only. Hearth TV (the TV app) builds, tests and releases in theSiegs/HearthTV.
jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # HACS installs the integration from the release tag, so its manifest must be valid and carry a version.
      - name: Check integration version
        run: python3 .github/scripts/integration_version.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: ha_tests/requirements.txt

      - name: Install test dependencies
        run: pip install -r ha_tests/requirements.txt

      # Errors only (syntax, undefined names), not style
      - name: Lint
        run: ruff check --select E9,F63,F7,F82 custom_components ha_tests tool

      - name: Test the integration
        working-directory: ha_tests
        run: python -m pytest -q -p no:cacheprovider .

      # Hearth's page in Home Assistant, drawn without a browser, and the words people read on it
      - name: Test Hearth's Home Assistant page
        run: node --test test/js/hearth_panel_test.mjs test/js/wording_test.mjs
