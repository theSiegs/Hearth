name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Mocks
        run: dart run build_runner build

      - name: Generate Database Migrations Schema
        run: dart run drift_dev schema generate drift_schemas/ test/generated_migrations/

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # The phone pages' encryption, against Node's own ChaCha20-Poly1305
      - name: Test phone page encryption
        run: node test/js/phone_seal_test.js

      # Compiles the Java side too, which nothing else checks before a release.
      - name: Build Debug APK
        run: flutter build apk --debug --target-platform=android-arm64

      - name: Test Java
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
